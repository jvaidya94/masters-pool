<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="220" height="220" fill="#1D3068"/>
  <!-- Oval crest -->
  <ellipse cx="110" cy="60" rx="38" ry="48" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- AGC monogram -->
  <text x="110" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="white" letter-spacing="-2">G</text>
  <text x="122" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="white">A</text>
  <text x="98" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="white">C</text>
  <!-- 20 | 26 -->
  <text x="42" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="white">20</text>
  <line x1="16" y1="66" x2="64" y2="66" stroke="white" stroke-width="1.5"/>
  <text x="178" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="white">26</text>
  <line x1="152" y1="66" x2="204" y2="66" stroke="white" stroke-width="1.5"/>
  <!-- PGA -->
  <text x="110" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="80" font-weight="900" fill="white" letter-spacing="-1">PGA</text>
  <!-- Rules -->
  <line x1="12" y1="167" x2="208" y2="167" stroke="white" stroke-width="2"/>
  <line x1="12" y1="173" x2="208" y2="173" stroke="white" stroke-width="1"/>
  <!-- ARONIMINK -->
  <text x="110" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="3" fill="white">ARONIMINK</text>
</svg>
